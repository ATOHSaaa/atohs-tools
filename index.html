<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="tools.atohs.me — ブラウザだけで動く、小さな Web ツール集。"
    />
    <title>tools.atohs.me</title>
    <script>
      (function () {
        const key = "atohs-theme";
        const legacy = "atohs-tools-theme";
        const stored = localStorage.getItem(key) ?? localStorage.getItem(legacy);
        const theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script type="module" src="/assets/js/main.js"></script>
  </head>
  <body class="site">
    <a class="skip-link" href="#main">本文へスキップ</a>

    <div class="site-content">
      <header class="header-top">
        <div class="header-inner">
          <p class="header-logo"><a href="/" id="site-title">tools.atohs.me</a></p>
          <div class="header-end">
            <button
              type="button"
              class="theme-toggle"
              id="theme-toggle"
              data-theme-toggle
              aria-label="ダークモードに切り替え"
            >
              <span class="theme-toggle-icon-slot" aria-hidden="true">
                <svg
                  class="theme-toggle-icon theme-toggle-icon--light"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="5"></circle>
                  <path
                    d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                  ></path>
                </svg>
                <svg
                  class="theme-toggle-icon theme-toggle-icon--dark"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      </header>

      <main id="main" class="main main--home" aria-labelledby="site-title">
        <nav class="tool-index" aria-label="ツール">
          <a href="/font-simulator/">Font Simulator</a>
        </nav>
      </main>

      <footer class="footer-top">
        <div class="footer-inner">
          <nav class="footer-links" aria-label="サイト">
            <a class="footer-link" href="/privacy.html">プライバシーポリシー</a>
          </nav>
        </div>
      </footer>
    </div>
  </body>
</html>
